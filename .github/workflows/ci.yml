name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} - Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        qt: ['5.15.2', '6.8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      # Windows 上需要 MSVC 环境(nmake/cl);2019 与 2022 工具链 ABI 兼容
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      # Windows 默认生成器是 Visual Studio(多配置),必须显式指定配置;
      # 单配置生成器(Linux/Ninja)会忽略 --config/-C,两侧统一写法
      - name: Build
        run: cmake --build build --config Debug

      # Linux 无显示环境,QPA 强制 offscreen(测试侧已设,这里兜底);
      # Windows runner 有桌面会话,按默认平台跑
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'native' }}
